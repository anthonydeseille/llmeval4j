name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and tests (Java ${{ matrix.java }})
    # Pinned rather than ubuntu-latest: the OS changes only when we choose to
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version and latest LTS
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # verify also builds the sources and javadoc jars: a javadoc error fails the build
      - name: Build and tests
        run: ./mvnw -B -ntp verify
